<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet">
</head>

<div class="header">
  <h3 class="user-status">{{currentUser?.username}} <button id="logout" (click)="logOut()">Log Out</button></h3>


  <nav class="navigation">
    <a routerLink="/about">About</a>
    &nbsp;
    <a routerLink="/needs">Cupboard</a>
    &nbsp;
    <a routerLink="/search">Search</a>
    &nbsp;
    <div *ngIf="!currentUser?.admin" style="display: inline;">
      <a routerLink="/basket">Basket</a>
      &nbsp;
    </div>
    <a routerLink="/settings">Settings</a>
  </nav>
</div>

<div class="body">
  <h1 class="title">Search</h1>

  <p>{{errorMessage}}</p>
  <div id="search-component">
    <div class="field">
      <input #searchBox class="input" type="text" id="search-box" name="searchbox" autocomplete="off" required>
      <label for="search-box">Search by Name</label>
    </div>
    <br>
    <label class="name" for="type-box">Type</label>
    <select class="dropdown" #typeBox id="type-box">
      <option value="">No Filter</option>
      <option value="Money">Money</option>
      <option value="Goods">Goods</option>
      <option value="Volunteer">Volunteer</option>
      <option value="Other">Other</option>
    </select>
    <br>
    <label class="name" for="contribution-percentage-min">Min Contribution %</label>
    <select class="dropdown" #contributionPercentageMin id="contribution-percentage-min">
      <option value="">No Filter</option>
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="40">40</option>
      <option value="50">50</option>
      <option value="60">60</option>
      <option value="70">70</option>
      <option value="80">80</option>
      <option value="90">90</option>
      <option value="100">100</option>

    </select>
    <br>
    <label class="name" for="contribution-percentage-max">Max Contribution % </label>
    <select class="dropdown" #contributionPercentageMax id="contribution-percentage-max">
      <option value="">No Filter</option>
      <option value="10">10</option>
      <option value="20">20</option>
      <option value="30">30</option>
      <option value="40">40</option>
      <option value="50">50</option>
      <option value="60">60</option>
      <option value="70">70</option>
      <option value="80">80</option>
      <option value="90">90</option>
      <option value="100">100</option>
    </select>
    <br>
    <button class="button2" type="button"
      (click)="search(searchBox.value, typeBox.value, contributionPercentageMin.value, contributionPercentageMax.value)">Search</button>
  </div>
  </div> 
  <ul class="search-result">
    <div *ngIf="(needs$ | async)?.length == 0">
      <span class="user-status">There are no matching needs.</span>
    </div>
    <li *ngFor="let need of needs$ | async">
      <div class="list-element">
        <div class="need-title">
          <a>
            {{need.name}}
          </a>
        </div>
        <div>
          <a class="need-type">
            {{need.type}} ({{need.currentQuantity}}/{{need.targetQuantity}})
          </a>
        </div>
        <div>
          <a class="need-description">
            {{need.description}}
          </a>
        </div>
        <div class="buttons">
          <div>
            <button class="button" routerLink="/detail/{{need.id}}">Details</button>
          </div>
          <div *ngIf="currentUser?.admin">
            <button type="button" class="button" title="delete need" (click)="confirm(need.id)">Remove Need</button>
          </div>
          <div class="message" *ngIf="showButton == need.id">
            <div class="message-text"><label>Remove this need?</label></div>
            <button type="button" class="button" title="confirm delete">Yes</button>
            <button type="button" class="button" title="deny delete" (click)="deny()">No</button>
          </div>
        </div>
      </div>
    </li>
  </ul>
